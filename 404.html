<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面不存在 · 今天读书了吗</title>
<style>
  :root{--fg:#2f2a24;--muted:#8a8072;--bg:#fbf8f2;--line:#e6ddcc;--accent:#5f7d5a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
  .box{text-align:center;padding:40px 28px;max-width:460px}
  .code{font-size:64px;line-height:1;font-weight:600;color:var(--accent);letter-spacing:2px}
  h1{font-size:18px;margin:18px 0 8px;font-weight:600}
  p{margin:0 0 22px;color:var(--muted);font-size:14px;line-height:1.7}
  a{display:inline-block;padding:9px 20px;border:1px solid var(--line);border-radius:999px;
    color:var(--fg);text-decoration:none;font-size:14px;background:#fff}
  a:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>这里没有内容</h1>
    <p>页面或文件不存在，可能已改名或从未存在过。</p>
    <a href="/">回到「今天读书了吗」</a>
  </div>
</body>
</html>
